name: NN6000V2 ImmortalWrt Release

on:
  workflow_dispatch:
    inputs:
      pppoe_username:
        description: 'PPPoE 宽带账号（留空跳过）'
        required: false
        default: '-'
        type: string
      pppoe_password:
        description: 'PPPoE 宽带密码（留空跳过）'
        required: false
        default: '-'
        type: string
      preflight_only:
        description: '仅执行配置与补丁 prepare 检查，不进行完整编译'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  DEVICE_MODEL: link_nn6000v2_immwrt
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: main
  BUILD_DIR: action_build

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          set -euxo pipefail
          df -h
          sudo apt-get update
          sudo bash -c 'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt-get install -y dos2unix libfuse-dev
          sudo timedatectl set-timezone Asia/Shanghai
          echo "BUILD_DATE=$(date +'%y.%m.%d_%H.%M.%S')" >> "$GITHUB_ENV"

      - name: Clone upstream source
        run: |
          set -euo pipefail
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" "$BUILD_DIR"
          git -C "$BUILD_DIR" rev-parse HEAD > repo_flag
          if [ -f "$BUILD_DIR/scripts/projectsmirrors.json" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$BUILD_DIR/scripts/projectsmirrors.json"
          fi

      - name: Validate build scripts and package selection
        run: |
          set -euo pipefail
          for script in nn6000v2/scripts/*.sh nn6000v2/patches/992_network_config.sh; do bash -n "$script"; done
          sh -n nn6000v2/patches/994_set_apk_repos
          if grep -Eiq 'passwall|smartdns|tailscale|zerotier|lucky|adguardhome|ghboost|openappfilter|istoreos' nn6000v2/scripts/{packages,update,feeds,system,docker}.sh; then
            echo "Removed plugin integration remains in build scripts."
            exit 1
          fi
          if grep -Eq '^CONFIG_PACKAGE_(luci-app-store|luci-app-istorex|taskd|luci-lib-taskd|luci-lib-xterm|luci-lib-ipkg|luci-app-passwall|luci-app-smartdns|luci-app-tailscale-community|luci-app-zerotier|luci-app-sqm|luci-app-lucky|luci-app-adguardhome|luci-app-ghboost|luci-app-oaf|kmod-nft-fullcone|kmod-nft-nat6)=y' nn6000v2/configs/link_nn6000v2_immwrt.config; then
            echo "Removed or invalid package remains selected."
            exit 1
          fi
          grep -q '^CONFIG_PACKAGE_fullconenat-sonic=y' nn6000v2/configs/link_nn6000v2_immwrt.config
          grep -q '^CONFIG_PACKAGE_luci-app-fullconenat-sonic=y' nn6000v2/configs/link_nn6000v2_immwrt.config
          grep -q '^CONFIG_IPV6=y' nn6000v2/configs/link_nn6000v2_immwrt.config
          grep -q '^CONFIG_PACKAGE_kmod-nf-nat6=y' nn6000v2/configs/link_nn6000v2_immwrt.config
          grep -q '^CONFIG_PACKAGE_kmod-nf-log6=y' nn6000v2/configs/link_nn6000v2_immwrt.config
          grep -q '^CONFIG_PACKAGE_kmod-nf-reject6=y' nn6000v2/configs/link_nn6000v2_immwrt.config
          grep -q '^CONFIG_PACKAGE_kmod-ip6tables=m' nn6000v2/configs/link_nn6000v2_immwrt.config
          grep -q '^CONFIG_PACKAGE_kmod-ip6-tunnel=m' nn6000v2/configs/link_nn6000v2_immwrt.config
          grep -q '^CONFIG_PACKAGE_kmod-sit=m' nn6000v2/configs/link_nn6000v2_immwrt.config
          grep -q '^CONFIG_PACKAGE_kmod-gre6=m' nn6000v2/configs/link_nn6000v2_immwrt.config
          grep -q '^CONFIG_PACKAGE_kmod-fou6=m' nn6000v2/configs/link_nn6000v2_immwrt.config
          test -s nn6000v2/patches/fullcone/firewall4/004-independent-ipv6.patch
          test -s nn6000v2/patches/fullcone/luci-app-fullconenat-sonic/fullconenat-sonic.js
          grep -q 'prepare' nn6000v2/scripts/build.sh
          grep -q 'preflight_sonic_fullcone' nn6000v2/scripts/build.sh
          git diff --check
          echo "Pre-build validation passed."

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/.ccache
            ${{ env.BUILD_DIR }}/staging_dir
          key: ${{ runner.os }}-${{ hashFiles('repo_flag') }}
          restore-keys: |
            ${{ runner.os }}-

      - name: Configure optional PPPoE credentials
        env:
          PPPoE_USER: ${{ inputs.pppoe_username || '-' }}
          PPPoE_PASS: ${{ inputs.pppoe_password || '-' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from shlex import quote

          path = Path("nn6000v2/patches/992_network_config.sh")
          data = path.read_text()
          for key, value in (
              ("PPPOE_USERNAME", os.environ["PPPoE_USER"]),
              ("PPPOE_PASSWORD", os.environ["PPPoE_PASS"]),
          ):
              data = re.sub(
                  rf"^{key}=.*$",
                  f"{key}={quote(value)}",
                  data,
                  flags=re.MULTILINE,
              )
          path.write_text(data)
          PY

      - name: Build Wi-Fi-enabled firmware or run preflight only
        run: |
          set -euo pipefail
          chmod +x nn6000v2/scripts/*.sh
          if [ "${{ inputs.preflight_only }}" = "true" ]; then
            ./nn6000v2/scripts/build.sh "$DEVICE_MODEL" debug
          else
            ./nn6000v2/scripts/build.sh "$DEVICE_MODEL"
          fi

      - name: Prepare release notes
        if: ${{ !inputs.preflight_only }}
        run: |
          set -euo pipefail
          manifest=$(find firmware -maxdepth 1 -type f -name '*.manifest' -print -quit)
          kver="unknown"
          if [ -n "$manifest" ]; then
            kver=$(grep '^kernel ' "$manifest" | grep -oE '[4-6]\.[0-9]+\.[0-9]+' | head -n1 || true)
            [ -n "$kver" ] || kver="unknown"
          fi
          {
            echo "## Link NN6000V2 固件"
            echo "- 源码：$REPO_URL（$REPO_BRANCH）"
            echo "- Kernel：$kver"
            echo "- 内核分区：12 MiB"
            echo "- Wi-Fi：已包含驱动并默认启用 2.4G / 5G"
            echo "- LAN：10.0.0.1"
            echo "- Web 管理：LuCI / Nginx"
          } > release_body.txt

      - name: Publish release
        if: ${{ !inputs.preflight_only }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ env.DEVICE_MODEL }}
          name: ${{ env.BUILD_DATE }}_${{ env.DEVICE_MODEL }}
          files: |
            firmware/*.bin
            firmware/*.manifest
            firmware/*.img.gz
            firmware/*.itb
            firmware/*.fip
            firmware/*.ubi
          body_path: release_body.txt
          make_latest: true
