name: NN6000V2 Practical Minimal Build

on:
  workflow_dispatch:
    inputs:
      kernel_patchver:
        description: "可选：指定内核主次版本（例如 6.6）；留空则使用源码默认版本。"
        required: false
        default: ""
        type: string
      clean_ccache:
        description: "是否清空并重新建立编译缓存；默认关闭以复用缓存、缩短编译时间。"
        required: false
        default: false
        type: boolean
      preflight_only:
        description: "仅运行源码 feeds、Kconfig 和设备配置预检，不进行固件编译。"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

env:
  DEVICE_MODEL: link_nn6000v2_immwrt
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出设备构建脚本
        uses: actions/checkout@v4

      - name: 构建前静态预检
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "===== 检查构建脚本语法 ====="
          for script in nn6000v2/scripts/*.sh; do
            bash -n "$script"
            echo "OK: $script"
          done
          echo "===== 检查设备配置与必要补丁文件 ====="
          test -s "nn6000v2/configs/kernel/${DEVICE_MODEL}.config"
          test -s "nn6000v2/configs/${DEVICE_MODEL}.ini"
          test -s nn6000v2/patches/991_custom_settings
          test -s nn6000v2/patches/992_set-wifi-uci.sh
          test -s nn6000v2/patches/nss_diag.sh
          for patch in nn6000v2/patches/991_custom_settings nn6000v2/patches/992_set-wifi-uci.sh nn6000v2/patches/994_set_luci_zh_cn nn6000v2/patches/995_set_apk_mirror nn6000v2/patches/nss_diag.sh; do
            sh -n "$patch"
            echo "OK: $patch"
          done
          grep -qx 'CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_link_nn6000-v2=y' "nn6000v2/configs/kernel/${DEVICE_MODEL}.config"
          echo "静态预检通过。"

      - name: 初始化编译环境
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo bash -c 'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo apt-get update
          sudo apt-get install -y dos2unix libfuse-dev gh
          sudo timedatectl set-timezone Asia/Shanghai

      - name: 设置构建信息
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_DATE="$(date '+%y.%m.%d_%H.%M.%S')"
          CONFIG_FILE="nn6000v2/configs/${DEVICE_MODEL}.ini"
          test -f "$CONFIG_FILE"
          BUILD_SRC="$(awk -F= '$1=="REPO_URL" {sub(/^[^=]*=/,""); print; exit}' "$CONFIG_FILE")"
          BUILD_BRANCH="$(awk -F= '$1=="REPO_BRANCH" {sub(/^[^=]*=/,""); print; exit}' "$CONFIG_FILE")"
          BUILD_BRANCH="${BUILD_BRANCH:-main}"
          {
            echo "BUILD_DATE=$BUILD_DATE"
            echo "BUILD_SRC=$BUILD_SRC"
            echo "BUILD_BRANCH=$BUILD_BRANCH"
          } >> "$GITHUB_ENV"

      - name: 准备并检出 ImmortalWrt 源码
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x nn6000v2/scripts/*.sh
          ./nn6000v2/scripts/pre_clone_action.sh "$DEVICE_MODEL"

      - name: 校验可选内核版本参数
        if: ${{ inputs.kernel_patchver != '' }}
        shell: bash
        env:
          KERNEL_PATCHVER: ${{ inputs.kernel_patchver }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$KERNEL_PATCHVER" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "请使用“主版本.次版本”格式，例如 6.6（不要填写 6.6.122）。" >&2
            exit 1
          fi
          # build.sh applies this after update.sh resets/pulls the source tree.
          echo "KERNEL_PATCHVER=$KERNEL_PATCHVER" >> "$GITHUB_ENV"

      - name: 恢复编译缓存
        if: ${{ !inputs.clean_ccache }}
        uses: actions/cache@v4
        with:
          path: action_build/.ccache
          key: ${{ runner.os }}-nn6000v2-ccache-${{ hashFiles('repo_flag', 'nn6000v2/configs/kernel/link_nn6000v2_immwrt.config') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nn6000v2-ccache-${{ hashFiles('repo_flag', 'nn6000v2/configs/kernel/link_nn6000v2_immwrt.config') }}-

      - name: 编译 NN6000 V2 固件（先执行 Kconfig 完整性预检）
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ inputs.preflight_only }}" == "true" ]]; then
            ./nn6000v2/scripts/build.sh "$DEVICE_MODEL" debug
          else
            ./nn6000v2/scripts/build.sh "$DEVICE_MODEL"
          fi

      - name: 检查固件产物
        if: ${{ !inputs.preflight_only }}
        id: firmware
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d firmware
          find firmware -maxdepth 1 -type f -printf '%f\n' | sort
          IMAGE_COUNT="$(find firmware -maxdepth 1 -type f \( -name '*.bin' -o -name '*.img' -o -name '*.itb' -o -name '*.ubi' -o -name '*.fip' -o -name '*.tar.gz' \) | wc -l)"
          if [[ "$IMAGE_COUNT" -lt 1 ]]; then
            echo "错误：./firmware 目录中没有找到固件镜像。" >&2
            exit 1
          fi
          MANIFEST="$(find firmware -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          if [[ -n "$MANIFEST" ]]; then
            KVER="$(awk '$1=="kernel" {for(i=1;i<=NF;i++) if($i ~ /^[0-9]+\.[0-9]+\.[0-9]+/) {print $i; exit}}' "$MANIFEST")"
          fi
          KVER="${KVER:-unknown}"
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "IMAGE_COUNT=$IMAGE_COUNT" >> "$GITHUB_OUTPUT"
          du -sh firmware

      - name: 输出编译环境信息
        if: ${{ !inputs.preflight_only }}
        shell: bash
        run: |
          echo "===== CPU 信息 ====="
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core' || true
          echo "===== 磁盘空间 ====="
          df -h
          echo "===== 编译缓存 ====="
          du -sh action_build/.ccache 2>/dev/null || true

      - name: 生成中文固件发布说明
        if: ${{ !inputs.preflight_only }}
        shell: bash
        run: |
          {
            echo "# Link NN6000 V2（IPQ60xx）实用精简固件"
            echo
            echo "## 构建信息"
            echo "- 设备型号：${DEVICE_MODEL}"
            echo "- 源码仓库：${BUILD_SRC}"
            echo "- 源码分支：${BUILD_BRANCH}"
            echo "- 编译时间：${BUILD_DATE}"
            echo "- 内核版本：${KVER}"
            echo
            echo "## 系统配置"
            echo "- 管理地址：10.0.0.1"
            echo "- 包管理器：APK（不使用 OPKG）"
            echo "- Web 管理：原版 LuCI + Argon 主题 + 简体中文语言"
            echo "- 防火墙：firewall4 + nftables"
            echo "- 无线：2.4GHz / 5GHz，默认 SSID 为 500/5，密码为 88888888"
            echo "- PPPoE：默认账号为占位符，首次启动不会自动配置拨号"
            echo "- NSS、无线和设备板级驱动：保留"
            echo
            echo "## 显式选择的主要软件包"
            echo "- luci"
            echo "- luci-theme-argon"
            echo "- firewall4"
            echo "- nftables"
            echo "- nftables-json"
            echo
            echo "## 内核模块"
            echo "- 保留设备参考配置和扩展依赖配置中全部 75 项显式选择的 kmod"
            echo "- 覆盖无线、USB、文件系统、网络、VPN、nftables、TProxy、TUN 等类别"
            echo "- 构建脚本逐项检查最终 manifest，缺少任一显式选择模块即判定失败"
            echo
            echo "## 精简说明"
            echo "- 保留全部显式选择的内核模块；不预装第三方可选服务插件，原版 LuCI 集合自带的基础管理页面保留"
            echo "- 不预装 Docker、Dockerman、Podman、QuickFile、Nginx、QuickStart、易有云等非必要服务"
            echo "- 不额外预装第三方服务插件和可选应用"
            echo
            echo "注意：以上软件包列表为本分支显式选择项，不代表上游目标默认软件包的完整清单。内核模块必须与本次固件内核 ABI 匹配。"
          } > release_body.txt

      - name: 发布固件
        if: ${{ !inputs.preflight_only }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nn6000v2-${{ env.BUILD_DATE }}
          name: NN6000V2-${{ env.BUILD_DATE }}
          body_path: release_body.txt
          files: firmware/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
