name: NN6000V2 Practical Minimal + QuickFile Build

on:
  workflow_dispatch:
    inputs:
      kernel_patchver:
        description: "可选：指定内核主次版本（例如 6.6）；留空使用源码默认版本。"
        required: false
        default: ""
        type: string
      clean_ccache:
        description: "跳过缓存恢复并重新建立缓存；默认关闭。"
        required: false
        default: false
        type: boolean
      pppoe_username:
        description: "可选：PPPoE 宽带账号；留空或填 - 则跳过。"
        required: false
        default: "-"
        type: string
      pppoe_password:
        description: "可选：PPPoE 宽带密码；留空或填 - 则跳过。"
        required: false
        default: "-"
        type: string

permissions:
  actions: write
  contents: write

env:
  DEVICE_MODEL: link_nn6000v2_immwrt
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 检出设备构建脚本
        uses: actions/checkout@v6.0.2

      - name: 初始化编译环境
        shell: bash
        run: |
          set -Eeuo pipefail
          df -h
          sudo bash -c 'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo apt-get update
          sudo apt-get install -y dos2unix libfuse-dev gh
          sudo apt-get autoremove -y --purge
          sudo apt-get autoclean
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo timedatectl set-timezone Asia/Shanghai
          df -h

      - name: 设置构建信息
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_DATE="$(TZ=Asia/Shanghai date '+%y.%m.%d_%H.%M.%S')"
          CONFIG_FILE="nn6000v2/configs/${DEVICE_MODEL}.ini"
          test -f "$CONFIG_FILE"
          BUILD_SRC="$(awk -F= '$1=="REPO_URL" {sub(/^[^=]*=/,""); print; exit}' "$CONFIG_FILE")"
          BUILD_BRANCH="$(awk -F= '$1=="REPO_BRANCH" {sub(/^[^=]*=/,""); print; exit}' "$CONFIG_FILE")"
          BUILD_BRANCH="${BUILD_BRANCH:-main}"
          {
            echo "BUILD_DATE=$BUILD_DATE"
            echo "BUILD_SRC=$BUILD_SRC"
            echo "BUILD_BRANCH=$BUILD_BRANCH"
          } >> "$GITHUB_ENV"
          echo "源码仓库：$BUILD_SRC"
          echo "源码分支：$BUILD_BRANCH"

      - name: 准备并检出 ImmortalWrt 源码
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x nn6000v2/scripts/*.sh
          ./nn6000v2/scripts/pre_clone_action.sh "$DEVICE_MODEL"
          test -s repo_flag
          test -d action_build

      - name: 应用可选内核版本
        if: ${{ inputs.kernel_patchver != '' }}
        shell: bash
        env:
          KERNEL_PATCHVER: ${{ inputs.kernel_patchver }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$KERNEL_PATCHVER" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "请使用主版本.次版本格式，例如 6.6。" >&2
            exit 1
          fi
          MAKEFILE="action_build/target/linux/qualcommax/Makefile"
          test -f "$MAKEFILE"
          grep -qE '^KERNEL_PATCHVER[:?+]?=' "$MAKEFILE" || {
            echo "未找到 KERNEL_PATCHVER，停止修改。" >&2
            exit 1
          }
          sed -i -E "s/^KERNEL_PATCHVER[:?+]?=.*/KERNEL_PATCHVER:=$KERNEL_PATCHVER/" "$MAKEFILE"
          grep -n '^KERNEL_PATCHVER' "$MAKEFILE"

      - name: 写入可选 PPPoE 配置
        shell: bash
        env:
          PPPOE_USERNAME: ${{ inputs.pppoe_username }}
          PPPOE_PASSWORD: ${{ inputs.pppoe_password }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os, re, shlex
          from pathlib import Path
          path = Path("nn6000v2/patches/993_set_pppoe.sh")
          content = path.read_text(encoding="utf-8")
          for key in ("PPPOE_USERNAME", "PPPOE_PASSWORD"):
              value = os.environ.get(key) or "-"
              if "\n" in value or "\r" in value:
                  raise SystemExit(f"{key} 不允许包含换行符")
              if value == "-":
                  continue
              content, count = re.subn(
                  rf"^{key}=.*$", f"{key}={shlex.quote(value)}",
                  content, count=1, flags=re.MULTILINE
              )
              if count != 1:
                  raise SystemExit(f"无法安全更新 {key}")
          path.write_text(content, encoding="utf-8")
          print("PPPoE 参数处理完成；账号密码不会输出到构建日志。")
          PY

      - name: 恢复编译依赖缓存
        if: ${{ !inputs.clean_ccache }}
        uses: actions/cache/restore@v5.0.4
        with:
          path: |
            action_build/.ccache
            action_build/staging_dir
          key: ${{ runner.os }}-nn6000v2-${{ hashFiles('repo_flag', 'nn6000v2/configs/kernel/link_nn6000v2_immwrt.config', 'nn6000v2/configs/kernel/nss.config') }}-${{ inputs.kernel_patchver || 'default' }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nn6000v2-${{ hashFiles('repo_flag', 'nn6000v2/configs/kernel/link_nn6000v2_immwrt.config', 'nn6000v2/configs/kernel/nss.config') }}-${{ inputs.kernel_patchver || 'default' }}-
            ${{ runner.os }}-nn6000v2-

      - name: 刷新 staging 缓存时间戳
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d action_build/staging_dir ]]; then
            find action_build/staging_dir -type d -name stamp -not -path '*target*' -print0 |
              while IFS= read -r -d '' dir; do find "$dir" -type f -exec touch {} +; done
          fi

      - name: 编译 NN6000 V2 固件
        shell: bash
        run: |
          set -Eeuo pipefail
          ./nn6000v2/scripts/build.sh "$DEVICE_MODEL"

      - name: 检查固件产物和内核版本
        id: firmware
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d firmware
          find firmware -maxdepth 1 -type f -printf '%f\n' | sort
          IMAGE_COUNT="$(find firmware -maxdepth 1 -type f \( -name '*.bin' -o -name '*.img' -o -name '*.itb' -o -name '*.ubi' -o -name '*.fip' -o -name '*.tar.gz' \) | wc -l)"
          [[ "$IMAGE_COUNT" -gt 0 ]] || { echo "没有找到固件镜像。" >&2; exit 1; }
          MANIFEST="$(find firmware -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          [[ -n "$MANIFEST" ]] || { echo "没有生成 manifest。" >&2; exit 1; }
          KVER="$(awk '$1=="kernel" {for(i=1;i<=NF;i++) if($i ~ /^[0-9]+\.[0-9]+\.[0-9]+/) {print $i; exit}}' "$MANIFEST")"
          KVER="${KVER:-unknown}"
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "IMAGE_COUNT=$IMAGE_COUNT" >> "$GITHUB_OUTPUT"
          echo "内核版本：$KVER"
          du -sh firmware

      - name: 保存编译依赖缓存
        if: ${{ success() }}
        uses: actions/cache/save@v5.0.4
        with:
          path: |
            action_build/.ccache
            action_build/staging_dir
          key: ${{ runner.os }}-nn6000v2-${{ hashFiles('repo_flag', 'nn6000v2/configs/kernel/link_nn6000v2_immwrt.config', 'nn6000v2/configs/kernel/nss.config') }}-${{ inputs.kernel_patchver || 'default' }}-${{ github.run_id }}

      - name: 输出编译环境信息
        if: always()
        shell: bash
        run: |
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core' || true
          df -h
          du -sh action_build/.ccache action_build/staging_dir 2>/dev/null || true

      - name: 生成中文固件发布说明
        shell: bash
        run: |
          {
            echo "# Link NN6000 V2（IPQ60xx）实用精简固件"
            echo
            echo "## 构建信息"
            echo "- 设备型号：${DEVICE_MODEL}"
            echo "- 源码仓库：${BUILD_SRC}"
            echo "- 源码分支：${BUILD_BRANCH}"
            echo "- 编译时间：${BUILD_DATE}"
            echo "- 内核版本：${KVER}"
            echo
            echo "## 系统配置"
            echo "- 管理地址：10.0.0.1"
            echo "- 包管理器：APK（不使用 OPKG）"
            echo "- Web 管理：仅使用 Nginx，uHTTPd 及其模块不打包"
            echo "- LuCI：原版 LuCI + Argon + 简体中文"
            echo "- 文件管理：QuickFile（Rust 后端）+ Nginx HTTP 反向代理"
            echo "- 外接存储：USB/UAS、ext4、VFAT、exFAT、NTFS3、F2FS、XFS"
            echo "- 防火墙：firewall4 + nftables，默认启用 FullCone NAT（全局及所有启用 masquerade 的区域）"
            echo "- 无线：2.4GHz / 5GHz，默认 SSID 为 500/5，密码为 88888888"
            echo "- PPPoE：未输入有效账号密码时保持未配置；输入后写入首次启动配置"
            echo "- NSS、无线和设备板级驱动：保留"
            echo
            echo "## 精简策略"
            echo "- 保留 QuickFile、Nginx/uWSGI、Argon、磁盘管理基础工具和所选网络/存储内核模块"
            echo "- 不预装 Docker、Dockerman、Podman、OpenClash、QuickStart、易有云及无关第三方应用"
            echo
            echo "注意：FullCone 只控制本机 NAT 行为，不能保证运营商 CGNAT、光猫或上级网络策略下实际获得 NAT1；最终软件包以本次 manifest 为准。"
          } > release_body.txt

      - name: 发布固件
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nn6000v2-${{ env.BUILD_DATE }}
          name: NN6000V2-${{ env.BUILD_DATE }}
          body_path: release_body.txt
          files: firmware/*
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理旧 Release（保留最近 10 个）
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          OLD_TAGS="$(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName')"
          if [[ -z "$OLD_TAGS" ]]; then
            echo "Release 数量未超过 10 个，无需清理。"
            exit 0
          fi
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            echo "清理旧 Release：$tag"
            gh release delete "$tag" --cleanup-tag --yes || true
          done <<< "$OLD_TAGS"
