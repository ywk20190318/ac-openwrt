name: NN6000V2 Practical Minimal + QuickFile Build

on:
  workflow_dispatch:
    inputs:
      kernel_patchver:
        description: "可选：指定内核主次版本（例如 6.6）；留空则使用源码默认版本。"
        required: false
        default: ""
        type: string
      clean_ccache:
        description: "是否清空并重新建立编译缓存；默认关闭以复用缓存、缩短编译时间。"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

env:
  DEVICE_MODEL: link_nn6000v2_immwrt
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出设备构建脚本
        uses: actions/checkout@v4

      - name: 初始化编译环境
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo bash -c 'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo apt-get update
          sudo apt-get install -y dos2unix libfuse-dev gh
          sudo timedatectl set-timezone Asia/Shanghai

      - name: 设置构建信息
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_DATE="$(date '+%y.%m.%d_%H.%M.%S')"
          CONFIG_FILE="nn6000v2/configs/${DEVICE_MODEL}.ini"
          test -f "$CONFIG_FILE"
          BUILD_SRC="$(awk -F= '$1=="REPO_URL" {sub(/^[^=]*=/,""); print; exit}' "$CONFIG_FILE")"
          BUILD_BRANCH="$(awk -F= '$1=="REPO_BRANCH" {sub(/^[^=]*=/,""); print; exit}' "$CONFIG_FILE")"
          BUILD_BRANCH="${BUILD_BRANCH:-main}"
          {
            echo "BUILD_DATE=$BUILD_DATE"
            echo "BUILD_SRC=$BUILD_SRC"
            echo "BUILD_BRANCH=$BUILD_BRANCH"
          } >> "$GITHUB_ENV"

      - name: 准备并检出 ImmortalWrt 源码
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x nn6000v2/scripts/*.sh
          ./nn6000v2/scripts/pre_clone_action.sh "$DEVICE_MODEL"

      - name: 应用可选内核版本
        if: ${{ inputs.kernel_patchver != '' }}
        shell: bash
        env:
          KERNEL_PATCHVER: ${{ inputs.kernel_patchver }}
        run: |
          set -Eeuo pipefail
          case "$KERNEL_PATCHVER" in
            *[!0-9.]*|'')
              echo "内核版本参数无效：$KERNEL_PATCHVER" >&2
              exit 1
              ;;
          esac
          if [[ ! "$KERNEL_PATCHVER" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "请使用“主版本.次版本”格式，例如 6.6（不要填写 6.6.122）。" >&2
            exit 1
          fi
          MAKEFILE="action_build/target/linux/qualcommax/Makefile"
          test -f "$MAKEFILE" || {
            echo "错误：找不到目标 Makefile：$MAKEFILE" >&2
            exit 1
          }
          grep -qE '^KERNEL_PATCHVER[:?+]?=' "$MAKEFILE" || {
            echo "错误：在 $MAKEFILE 中未找到 KERNEL_PATCHVER，已停止修改以避免错误追加。" >&2
            exit 1
          }
          sed -i -E "s/^KERNEL_PATCHVER[:?+]?=.*/KERNEL_PATCHVER:=${KERNEL_PATCHVER}/" "$MAKEFILE"
          grep -n '^KERNEL_PATCHVER' "$MAKEFILE"

      - name: 恢复编译缓存
        if: ${{ !inputs.clean_ccache }}
        uses: actions/cache@v4
        with:
          path: action_build/.ccache
          key: ${{ runner.os }}-nn6000v2-ccache-${{ hashFiles('repo_flag', 'nn6000v2/configs/kernel/link_nn6000v2_immwrt.config') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nn6000v2-ccache-${{ hashFiles('repo_flag', 'nn6000v2/configs/kernel/link_nn6000v2_immwrt.config') }}-

      - name: 编译 NN6000 V2 固件
        shell: bash
        run: |
          set -Eeuo pipefail
          ./nn6000v2/scripts/build.sh "$DEVICE_MODEL"

      - name: 检查固件产物
        id: firmware
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d firmware
          find firmware -maxdepth 1 -type f -printf '%f\n' | sort
          IMAGE_COUNT="$(find firmware -maxdepth 1 -type f \( -name '*.bin' -o -name '*.img' -o -name '*.itb' -o -name '*.ubi' -o -name '*.fip' -o -name '*.tar.gz' \) | wc -l)"
          if [[ "$IMAGE_COUNT" -lt 1 ]]; then
            echo "错误：./firmware 目录中没有找到固件镜像。" >&2
            exit 1
          fi
          MANIFEST="$(find firmware -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          if [[ -n "$MANIFEST" ]]; then
            KVER="$(awk '$1=="kernel" {for(i=1;i<=NF;i++) if($i ~ /^[0-9]+\.[0-9]+\.[0-9]+/) {print $i; exit}}' "$MANIFEST")"
          fi
          KVER="${KVER:-unknown}"
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "IMAGE_COUNT=$IMAGE_COUNT" >> "$GITHUB_OUTPUT"
          du -sh firmware

      - name: 输出编译环境信息
        shell: bash
        run: |
          echo "===== CPU 信息 ====="
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core' || true
          echo "===== 磁盘空间 ====="
          df -h
          echo "===== 编译缓存 ====="
          du -sh action_build/.ccache 2>/dev/null || true

      - name: 生成中文固件发布说明
        shell: bash
        run: |
          {
            echo "# Link NN6000 V2（IPQ60xx）实用精简固件"
            echo
            echo "## 构建信息"
            echo "- 设备型号：${DEVICE_MODEL}"
            echo "- 源码仓库：${BUILD_SRC}"
            echo "- 源码分支：${BUILD_BRANCH}"
            echo "- 编译时间：${BUILD_DATE}"
            echo "- 内核版本：${KVER}"
            echo
            echo "## 系统配置"
            echo "- 管理地址：10.0.0.1"
            echo "- 包管理器：APK（不使用 OPKG）"
            echo "- Web 管理：仅使用 Nginx（uHTTPd 及其模块不打包）+ 原版 LuCI + Argon + 简体中文语言"
            echo "- 文件管理：QuickFile（Rust 后端）+ Nginx HTTP 反向代理"
            echo "- 外接存储：USB/UAS、ext4、VFAT、exFAT、NTFS3、F2FS、XFS"
            echo "- 防火墙：firewall4 + nftables，默认启用 FullCone NAT（全局及所有启用 masquerade 的区域）"
            echo "- 无线：2.4GHz / 5GHz，默认 SSID 为 500/5，密码为 88888888"
            echo "- PPPoE：默认账号为占位符，首次启动不会自动配置拨号"
            echo "- NSS、无线和设备板级驱动：保留"
            echo
            echo "## 显式选择的主要软件包"
            echo "- luci-nginx"
            echo "- luci-theme-argon"
            echo "- luci-app-quickfile"
            echo "- quickfile"
            echo "- nginx-ssl / nginx-util / nginx-mod-luci / nginx-mod-ubus"
            echo "- uwsgi / uwsgi-luci-support"
            echo "- block-mount / ntfs3-mount / fuse-utils / usbutils / sgdisk / resize2fs"
            echo "- firewall4"
            echo "- nftables"
            echo "- nftables-json"
            echo
            echo "## 显式选择的内核模块包"
            echo "- kmod-nft-tproxy（nftables TProxy）"
            echo "- kmod-tun（TUN 虚拟网络设备）"
            echo "- kmod-nft-fullcone"
            echo "- kmod-nft-bridge"
            echo "- kmod-tcp-bbr"
            echo "- kmod-netlink-diag"
            echo "- kmod-inet-diag"
            echo "- kmod-tls"
            echo "- kmod-usb-storage / kmod-usb-storage-uas / kmod-usb-storage-extras"
            echo "- kmod-usb2 / kmod-usb3 / kmod-usb-dwc3 / kmod-usb-xhci-hcd / kmod-usb-ehci / kmod-usb-ohci"
            echo "- kmod-fs-ext4 / kmod-fs-vfat / kmod-fs-exfat / kmod-fs-ntfs3 / kmod-fs-f2fs / kmod-fs-xfs"
            echo
            echo "## 精简说明"
            echo "- 仅预留 OpenClash 所需内核模块，不预装 OpenClash 本体"
            echo "- 不预装 Docker、Dockerman、Podman、OpenClash、QuickStart、易有云等非必要服务"
            echo "- 不额外预装第三方服务插件和可选应用"
            echo
            echo "注意：以上软件包列表为本分支显式选择项，不代表上游目标默认软件包的完整清单。内核模块必须与本次固件内核 ABI 匹配。"
          } > release_body.txt

      - name: 发布固件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nn6000v2-${{ env.BUILD_DATE }}
          name: NN6000V2-${{ env.BUILD_DATE }}
          body_path: release_body.txt
          files: firmware/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
